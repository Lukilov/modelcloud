<!doctype html>
<html lang="sl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="modelcloud.si — domena naprodaj." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23111'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-family='monospace' font-size='28' fill='%23f7f6f2'%3Emc%3C/text%3E%3C/svg%3E" />
    <title>modelcloud.si</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #111;
        --paper: #f7f6f2;
      }

      * { box-sizing: border-box; }

      html, body { min-height: 100%; }

      body {
        margin: 0;
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: 24px;
        color: var(--ink);
        background: var(--paper);
        font-family: "Courier New", Courier, monospace;
      }

      main {
        width: min(100%, 720px);
        text-align: center;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.35rem, 4vw, 2.6rem);
        font-weight: 400;
        letter-spacing: 0.02em;
        line-height: 1.35;
      }

      h1::after {
        content: "_";
        display: inline-block;
        margin-left: 0.12em;
        animation: blink 1s steps(1) infinite;
      }

      .contact {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 16px;
        flex-wrap: wrap;
        margin-top: 34px;
        font-size: clamp(0.85rem, 2.5vw, 1rem);
      }

      .email { margin: 0; }

      .email a {
        color: inherit;
        text-decoration: none;
        border-bottom: 1px solid currentColor;
      }

      .email a:hover,
      .email a:focus-visible { opacity: 0.6; }

      .button {
        display: inline-block;
        padding: 11px 18px;
        color: var(--paper);
        background: var(--ink);
        border: 1px solid var(--ink);
        text-decoration: none;
        transition: background 160ms ease, color 160ms ease;
      }

      .button:hover,
      .button:focus-visible {
        color: var(--ink);
        background: transparent;
      }

      .button:focus-visible,
      .email a:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }

      @keyframes blink { 50% { opacity: 0; } }

      @media (prefers-reduced-motion: reduce) {
        h1::after { animation: none; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>This domain: modelcloud.si is for sale.</h1>
      <div class="contact">
        <p class="email"><a href="mailto:lukisdomain@gmail.com">lukisdomain@gmail.com</a></p>
        <a class="button" href="mailto:lukisdomain@gmail.com?subject=Interest%20in%20modelcloud.si">write me a mail</a>
      </div>
    </main>
  </body>
</html>
